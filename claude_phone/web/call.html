<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Phone</title>
<style>
  :root { --bg: #fafafa; --fg: #111; --muted: #6b6b6b; --line: #e2e2e2; --accent: #d97757; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141414; --fg: #f2f2f2; --muted: #9a9a9a; --line: #2c2c2c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; }
  main { width: 100%; max-width: 420px; text-align: center; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  textarea { width: 100%; margin: 24px 0 16px; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
             background: transparent; color: var(--fg); font: inherit; resize: vertical; min-height: 72px; }
  button { width: 100%; padding: 14px; border: 0; border-radius: 10px; background: var(--accent); color: #fff;
           font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 20px; min-height: 48px; font-size: 15px; }
  #status .answer { color: var(--fg); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Claude Phone</h1>
  <p>يتصل على جوالك. خل تطبيق الاتصال مفتوح · Rings your iPhone. Keep the SIP app open.</p>
  <textarea id="q" dir="auto" aria-label="Question">هلا والله، خلصت الشغل طال عمرك، تامر على شي ثاني؟</textarea>
  <button id="call">اتصل علي · Call me</button>
  <div id="status" role="status"></div>
</main>
<script>
  const btn = document.getElementById("call"), status = document.getElementById("status");
  btn.onclick = async () => {
    btn.disabled = true;
    status.textContent = "Ringing… answer, speak after the beep, then hang up.";
    try {
      const r = await fetch("/test-call", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: document.getElementById("q").value }),
      });
      const res = await r.json();
      if (res.status === "answered") {
        status.innerHTML = "You said: <span class='answer'></span>";
        status.querySelector(".answer").textContent = "“" + res.answer + "”";
      } else {
        status.textContent = "No answer (" + (res.reason || res.message || res.status) + ").";
      }
    } catch (e) {
      status.textContent = "Couldn't reach the phone daemon. Is it running? (phone status)";
    }
    btn.disabled = false;
  };
</script>
</body>
</html>
